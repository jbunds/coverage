# https://pre-commit.com/
# https://github.com/pre-commit/pre-commit-hooks

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev:  v6.0.0
    hooks:
      - id:    check-yaml                             # https://github.com/pre-commit/pre-commit-hooks#check-yaml
        files: \.ya?ml$
  - repo: https://github.com/mpalmer/action-validator # https://github.com/mpalmer/action-validator#using-pre-commit
    rev:  v0.9.0
    hooks:
      - id: action-validator
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.7
    hooks:
      - id:                      biome-lint
        files:                   '\.(?:css|js)$'
        exclude:                 '^css/style\.css$'  # Biome chokes on the Go template syntax
        additional_dependencies: ['@biomejs/biome@2.5.7']
  - repo: https://github.com/golangci/golangci-lint   # https://github.com/golangci/golangci-lint/blob/main/.pre-commit-hooks.yaml
    rev:  v2.12.2
    hooks:
      - id:             golangci-lint
        name:           golangci-lint run
        entry:          golangci-lint run --verbose
        language:       golang
        types:          [go]
        pass_filenames: false
  - repo: local
    hooks:
      - language:       system
        id:             go-test
        name:           go test
        entry:          go test -v -race ./...
        files:          \.go$|^go\.(?:mod|sum)$
        pass_filenames: false
        require_serial: true
