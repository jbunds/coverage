# https://pre-commit.com/
# https://github.com/pre-commit/pre-commit-hooks

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev:  v6.0.0
    hooks:
      - id:    check-yaml                             # https://github.com/pre-commit/pre-commit-hooks#check-yaml
        files: \.ya?ml$
  - repo: https://github.com/mpalmer/action-validator # https://github.com/mpalmer/action-validator#using-pre-commit
    rev:  v0.9.0
    hooks:
      - id:    action-validator
        files: '(?:^action\.ya?ml$|^\.github/(?:workflows|actions)/.*\.ya?ml$)'
  - repo: https://github.com/biomejs/pre-commit
    rev:  v2.5.15
    hooks:
      - id:                      biome-lint
        files:                   '\.(?:css|js)$'
        additional_dependencies: ['@biomejs/biome@2.5.15']
        args:                    [--error-on-warnings]
  - repo: https://github.com/golangci/golangci-lint   # https://github.com/golangci/golangci-lint/blob/main/.pre-commit-hooks.yaml
    rev:  v2.13.1
    hooks:
      - id:             golangci-lint
        name:           go lint
        entry:          golangci-lint run
        language:       golang
        types:          [go]
        pass_filenames: false
  - repo: local
    hooks:
      - id:             go-test
        name:           go test
        entry:          go test -race .
        files:          \.go$|^go\.(?:mod|sum)$
        language:       system
        pass_filenames: false
        require_serial: true
