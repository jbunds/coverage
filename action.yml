# https://docs.github.com/actions/reference/workflows-and-actions/metadata-syntax

# reusable composite action which does the following:
#
#   1. expects callers to call actions/setup-go@v7 in a preceeding step
#
#   2. uses gwatts/go-coverage-action@v2 to create a Go test coverage
#      profile file
#
#   3. runs `go run github.com/jbunds/coverage@latest` to generate a Go
#      test coverage HTML report from the generated coverage profile

name:        Go test coverage HTML report
description: Go test coverage HTML report generator
author:      jbunds
branding:
  icon:  layout
  color: blue

inputs:
  go-mod:
    description: path to the module's go.mod file
    required:    false
    default:     go.mod
  test-pkgs:
    description: Go package patterns to test (newline-separated, passed to `go test`)
    required:    false
    default:     ./...
  cover-pkg:
    description: Go package scope (comma-delimited list of Go package patterns, passed to `go test -coverpkg`)
    required:    false
    default:     ./...
  coverage-threshold:
    description: coverage threshold percentage (gwatts/go-coverage-action)
    required:    false
    default:     '0'
  coverage-report-outdir:
    description: path to the root of the Go coverage report
    required:    false
    default:     coverage_report
  workspace-repos:
    type:        string
    description: newline-separated list of GitHub repos ("owner/repo") to check out
    required:    false
    default:     ''

outputs:
  all:           # accessed downstream via ${{ fromJson(steps.coverage_report.outputs.all).report-pathname }} for example
    description: JSON string containing all outputs published by gwatts/go-coverage-action
    value:       ${{ toJson(steps.coverage_profile.outputs) }}

runs:
  using: composite
  steps:
    - name:  init workspace
      id:    init_workspace
      shell: bash
      if:    inputs.workspace-repos != ''
      run: |
        dirs=''
        while IFS= read -r repo; do
          dirs="$dirs ./$(basename "$repo")"
        done <<< "${{ inputs.workspace-repos }}"
        go work init . $dirs

    - name: coverage profile
      id:   coverage_profile
      uses: gwatts/go-coverage-action@v2
      with:
        test-pkgs:          ${{ inputs.test-pkgs          }}
        cover-pkg:          ${{ inputs.cover-pkg          }}
        coverage-threshold: ${{ inputs.coverage-threshold }}

    - name:  coverage report
      id:    coverage_report
      shell: bash
      run: |
        gomod="${{ inputs.go-mod }}"
        [ -f go.work ] && gomod=go.work
        go run github.com/jbunds/coverage@latest \
          -n \
          -gomod="$gomod" \
          -coverprofile="${{ steps.coverage_profile.outputs.gocov-pathname }}" \
          -outdir="${{ inputs.coverage-report-outdir }}"
