# all-in-one reusable workflow which does the following:
#
#   1. generates a Go test coverage HTML report via ./action.yml
#      (resolved via jbunds/coverage@v1)
#
#   2. uses ./.github/actions/upload-pages/action.yml
#      (resolved via jbunds/coverage/.github/actions/upload-pages@v1)
#      to upload the Go test coverage HTML report files to GitHub Pages
#      per these standard actions:
#
#        - actions/configure-pages@v6
#        - actions/upload-pages-artifact@v5
#
#   3. deploys the Go test coverage HTML report to GitHub Pages
#      via actions/deploy-pages@v5

name: deploy coverage report to Pages

on:
  workflow_call:
    inputs:
      go-mod:
        type:        string
        description: path to the module's go.mod or go.work file
        required:    false
        default:     go.mod
      test-pkgs:
        type:        string
        description: Go package patterns to test (newline-separated, passed to `go test`)
        required:    false
        default:     ./...
      cover-pkg:
        type:        string
        description: Go package scope (comma-delimited list of Go package patterns, passed to `go test -coverpkg`)
        required:    false
        default:     ./...
      coverage-threshold:
        type:        string
        description: coverage threshold percentage
        required:    false
        default:     0
      coverage-report-outdir:
        type:        string
        description: path to the root of the Go coverage report
        required:    false
        default:     coverage_report
      workspace-repos:
        type:        string
        description: newline-separated list of GitHub repos ("owner/repo") to check out
        required:    false
        default:     ''

concurrency: # avoid races
  group:              pages
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 10 # https://github.com/gwatts/go-coverage-action#example-workflow

      - uses: actions/setup-go@v7 # https://github.com/actions/setup-go
        with:
          go-version-file: ${{ inputs.go-mod || 'go.mod' }} # https://github.com/marketplace/actions/setup-go-environment#supported-version-syntax

      - name: checkout workspace repos
        if:   inputs.workspace-repos != ''
        run: |
          while IFS= read -r repo; do
            name=$(basename "$repo")
            echo "checking out $repo -> ./$name"
            git clone --depth 1 "https://github.com/$repo.git" "$name"
          done <<< "${{ inputs.workspace-repos }}"

      - name: Go test coverage report
        uses: jbunds/coverage@v1
        with:
          go-mod:                 ${{ inputs.go-mod                 || 'go.mod'          }}
          test-pkgs:              ${{ inputs.test-pkgs              || './...'           }}
          cover-pkg:              ${{ inputs.cover-pkg              || './...'           }}
          coverage-threshold:     ${{ inputs.coverage-threshold     || '0'               }}
          coverage-report-outdir: ${{ inputs.coverage-report-outdir || 'coverage_report' }}

      - name: upload to GitHub Pages
        uses: jbunds/coverage/.github/actions/upload-pages@v1
        with:
          coverage-report-outdir: ${{ inputs.coverage-report-outdir || 'coverage_report' }}

  deploy:
    runs-on: ubuntu-latest
    needs:   generate-and-upload
    permissions:      # required permissions for the GITHUB_TOKEN to deploy to GitHub Pages
      contents: write # required for callers to execute `git push origin refs/notes/gocoverage`; https://docs.github.com/actions/reference/workflows-and-actions/reusing-workflow-configurations#access-and-permissions-for-nested-workflows
      pages:    write
      id-token: write
    environment:
      name: github-pages
      url:  ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to GitHub Pages
        id:   deployment
        uses: actions/deploy-pages@v5
